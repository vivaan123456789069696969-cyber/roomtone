# Minimal Supabase CLI config for local development (`supabase start`).
# Production auth settings (site URL, redirect URLs) are set in the dashboard;
# see docs/DEPLOYMENT.md.
project_id = "roomtone"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/welcome", "http://localhost:5173/reset-password"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[functions.generate-concept]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
